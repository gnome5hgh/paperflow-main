# .paperflow/intent/taxonomy.yaml —— 意图类别知识库（随仓库发布的生产资产）
#
# 每个类别给一段**判定口径**加若干**示例句**：两者一起构成判定模型看到的 criteria。
# 描述要写清「是什么 / 不包什么」——类别之间的边界是判定的全部难点，只写正面定义
# 等于把边界留给模型去猜。
#
# 示例句取自旧路由知识库的人工例句（挑改，不是整份照搬），与 rules.yaml 里的高精度
# 模式逐字不重复——同一句话既当示例又当规则会让两边都失去意义。
#
# 类别枚举与工作去向见 docs/adr/0007-intent-recognition.md。

classes:
  paper:
    description: >-
      论文事务：把论文找出来、下载下来，或针对**某一篇指定论文**读正文、分析图表、
      给判断，也包括删掉语料里的 PDF。判定要点是「要动论文这个对象本身」。
      不包含：把论文写成笔记（note）、登记进引用库（citation）、让语料能被检索（index）、
      就已有材料回答一般性知识问题（question）。
    examples:
      - 下载最新论文
      - 搜索 circRNA 文献
      - 找一篇异构图神经网络的论文
      - 查一下药物靶点预测的最新进展
      - 帮我搜索关于 miRNA 的综述
      - 检索链路预测的相关文献
      - 这篇论文的方法有什么缺陷
      - 帮我精读一下这篇论文，指出实验设计的问题
      - 分析一下这个方法的优缺点
      - 删掉这篇下载错的论文

  note:
    description: >-
      笔记事务：产出或删除一篇笔记文件——基于指定 PDF 撰写结构化笔记、把某篇论文的
      要点整理成笔记、修订既有笔记、删掉写错的笔记。判定要点是「要产出/删除笔记文件」。
      不包含：只读笔记内容回答问题（question）、读论文原文（paper）。
    examples:
      - 把这篇论文整理成笔记
      - 写一份笔记
      - 给这篇文章生成一个阅读摘要
      - 帮我总结一下这篇论文的要点
      - 为这篇 circRNA 论文做一份笔记
      - 总结这篇论文并保存成笔记
      - 删掉这篇笔记
      - 笔记写错了，删掉重来

  research:
    description: >-
      选题事务：从已有语料出发给出研究方向、研究空白、候选课题或可执行的研究计划，
      也包括删除这些选题产物（survey/gaps/idea 卡/研究计划）。判定要点是「要一个方向
      或计划，而不是一个事实或一份材料」。
      不包含：找或读具体论文（paper）、把某篇论文写成笔记（note）。
    examples:
      - 帮我找一个研究方向
      - 帮我看看我能做什么研究
      - 我读过的论文能支撑什么研究
      - 帮我看看读过的文献里有哪些研究空白
      - 把我读过的论文变成研究计划
      - 删掉这个研究计划

  citation:
    description: >-
      引用库事务：管的只有 references.bib 这一个文件——把语料同步或导入进去、新增单条、
      删除条目、查询导出、按指定格式渲染参考文献。判定要点是「动引用库 / bib」。
      不包含：论文本身（paper）、写笔记（note）。
    examples:
      - 把论文库的论文都加入bib
      - 把我语料库里的论文都导入references.bib
      - 同步论文库到引用库
      - 把语料库和引用库同步一下
      - 更新我的references.bib
      - 把新下载的论文加入bib
      - 引用库和语料库对齐一下
      - 删掉引用库里那条重复的条目

  index:
    description: >-
      语料索引事务：把新文件入库、重建或刷新索引、删除后收敛、检查索引现状。判定要点是
      「让检索能搜到（或搜不到）某个文件」，而不是「把论文找出来」。
      不包含：检索内容本身（那是 question 或 paper 域的材料需求）、维护引用库（citation）。
    examples:
      - 把新拷进来的论文入库
      - 把这些论文加入索引
      - 重建一下索引
      - 刷一下索引
      - 索引好像不对，重新建一遍
      - 语料库里少了刚下载的那篇
      - 我手动放了几个 PDF 进去，帮我建索引
      - 让检索能搜到这些新论文

  memory:
    description: >-
      记忆事务：查自己的阅读记录、未读清单、笔记列表、收藏与浏览记录，把论文加入或移出
      未读；**也包括用户陈述自己的研究方向、专业、偏好**（这是要记进用户画像
      的信息，不是要系统去做什么事）。判定要点是「关于用户自己或它的清单」。
      不包含：问学术知识（question）、维护引用库（citation）。
    examples:
      - 我读过哪些论文
      - 显示阅读记录
      - 我标记过的已读文献有哪些
      - 我最近看过哪些论文
      - 帮我看看我的笔记列表
      - 我收藏了哪些论文
      - 我的研究方向是异构图神经网络
      - 我最近在研究图对比学习
      - 我打算研究miRNA与疾病的关联

  question:
    description: >-
      即问即答：就学术内容问一个具体问题、要一个解释或判断（机制是什么、这个方法怎么做、
      这个公式什么意思、这个结论可不可靠），依据在上下文或语料里。
      不包含：针对**某一篇指定论文或笔记**的问题——那要先把原文读出来，属 paper 或
      从笔记取材料的路径；要一份文件（note）、要一个新方向（research）、问的是自己的
      历史或清单（memory）。
    examples:
      - circRNA 的机制是什么
      - 解释一下这个公式
      - 异构图神经网络是怎么工作的
      - 链路预测用的是什么方法
      - 图对比学习的核心思想是什么
      - 什么是 miRNA 海绵机制
      - 这个损失函数代表什么意思
      - 为什么用异构图而不是同构图

  chitchat:
    description: >-
      寒暄应答：打招呼、道谢、告别、随口闲聊，整句不构成任何学术请求。
      不包含：问系统能做什么（help）、对系统表现的反馈（feedback）、越界的代办请求
      （out_of_scope）。
    examples:
      - 你好啊
      - 早上好
      - 晚上好
      - 多谢啦
      - 辛苦了
      - 拜拜啦
      - 你是谁呀
      - 在吗

  out_of_scope:
    description: >-
      非本系统的任务，两种情形都要归到这一类：① **明确越界**——订外卖、查天气、写代码、
      代写论文这类本系统不做的代办；② **看不出用户要做什么**——信息不足以归入任何一类。
      系统对前者明确拒绝并说明能力边界，对后者先向用户问清，不要直接拒。
      不包含：闲聊（chitchat）、问功能（help）。
    examples:
      - 帮我订个外卖
      - 你能帮我查天气吗
      - 帮我订一张机票
      - 你能帮我写一封邮件吗
      - 帮我代写论文
      - 帮我写代码
      - 帮我翻译一段话
      - 帮我处理一下那篇

  help:
    description: >-
      功能与方法询问：这个系统能做什么、怎么用、有哪些功能、支持哪些操作、怎么开始。
      不包含：闲聊（chitchat）、对具体结果的反馈（feedback）。
    examples:
      - 你能干什么
      - 怎么用
      - 你可以帮我做什么
      - 介绍一下你的功能
      - 有什么功能
      - 我不太会用
      - 你会哪些操作
      - 你可以提供哪些服务

  feedback:
    description: >-
      对系统表现的评价与纠正：说刚才的回答、检索结果、生成的笔记或建议不对、不好、
      漏了重点，或指出上次说错了。判定要点是「用户在评价系统已经做过的事」。
      不包含：提出一个新的学术请求、闲聊（chitchat）。
    examples:
      - 这个回答不对
      - 这篇论文不是我要的
      - 你刚才说错了
      - 这个结果不太对
      - 上次那个回答有问题
      - 这篇笔记写得不好
      - 搜索结果不对
      - 我不满意这个回答
