# paperFlow 配置模板 —— 复制为 config.yaml 使用（config.yaml 被 gitignore，不会提交）
#   cp config.example.yaml config.yaml
#
# 纯覆盖文件：只写「要改的值」，未列出的字段回落代码默认值。所有可调参数的
# 默认值**唯一声明在 paperflow/config.py**（dataclass 字段默认值，含注释）——
# 改默认值只改那里，本模板不重复罗列，避免两处同步。
# 加载顺序：config.py 默认值 ← config.yaml ← PAPERFLOW_* 环境变量（后者最高）
# env 名 = PAPERFLOW_ + 配置路径大写（rag.storage.uri → PAPERFLOW_RAG_STORAGE_URI）；
# agents.timeouts 与 mcp_servers 是自由 dict，仅 YAML 可配。

llm:
  api_key: ""                 # 必填：或 env PAPERFLOW_LLM_API_KEY / .env

# 视觉模型（多模态图表分析）：与文本 LLM 同端点/key 的默认已内置，换端点才需要覆盖
vision:
  api_key: ""                 # 留空不崩启动，图表分析调用时降级

# 语料库与产物路径（个人绝对路径，文件类工具的数据源；research/bib 留空走默认派生）
corpus:
  note_dir: ""                # 论文笔记根目录
  pdf_dir: ""                 # PDF 根目录
  research_dir: ""
  citations_bib_path: ""

# 意图编码器默认与 rag.embedding 同模型，留空继承其端点/key；换模型需重标路由阈值
# intent:
#   encoder:
#     model: Qwen/Qwen3-Embedding-8B

# RAG 检索栈：嵌入/精排端点、检索参数、切块、存储等的默认值见 paperflow/config.py
rag:
  embedding:
    api_key: ""               # 必填才能启用稠密检索/嵌入；留空路由退化纯 BM25

# 子代理超时（秒，仅 YAML）；默认值见 config.py AgentsConfig，撞帽即需重估
# agents:
#   timeouts:
#     noter: 900
#     researcher: 1800

# MCP server 接入（工具前缀 mcp__paper-search__*；详见 docs/learning/11-MCP客户端.md）
mcp_servers:
  paper-search:
    transport: stdio
    command: uvx
    # 固定 git rev：uvx 对未固定 rev 每次启动都做远端 Git fetch（实测 7-12s，启动大头）；
    # 固定后 uv 直接用缓存 checkout（实测 0.4s）。升级 server 时手动改这个 SHA
    # （取新值：git ls-remote https://github.com/openags/paper-search-mcp HEAD）
    args: ["--from", "git+https://github.com/openags/paper-search-mcp@cab1b5cc276a0cd004a0044003926a6440088049", "--with", "mcp<2", "paper-search-mcp"]
    # git main（未发版）已给全部 73 工具显式注解（search/read=readOnlyHint:true，download=false+destructive）
    # --with mcp<2：server 依赖尚未兼容 mcp 2.x（FastMCP 改名）；上游发版后可简化
    agents: [searcher]           # 挂给哪些 agent
    # connect_timeout: 30        # uvx 冷启动慢，默认 30s
    # call_timeout: 120
    # disabled_tools: [search_ieee]
    # allowed_tools: null        # null=不限制；列表=白名单
    # write_tools: []            # 写类工具（下载等）默认禁用；按需显式开启
    write_tools: [download_with_fallback, download_semantic, read_arxiv_paper, read_pubmed_paper]
    env:
      PAPER_SEARCH_MCP_UNPAYWALL_EMAIL: ""   # 按需填入 Unpaywall 请求邮箱
