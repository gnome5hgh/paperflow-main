#   到最高分真实意图）——标定后此注释删除
# data/intents/routes.yaml —— 意图知识库（训练集；初始扩展 ~每类 20 条）
# 规模：4 真实意图 × ~20 条 = 80 条（门槛涌现起点，最终规模由 verify_intent 门槛驱动迭代）
# general 无 route 例句——兜底不配例句（fit 只在真实意图上校准，general 是阈值涌现副产品，spec §4.7.6）
# score_threshold 不手工填——由 Task 10 verify_intent 标定达标后写回（交付态）
# 领域：生物信息学/计算生物学（circRNA / miRNA / 异构图神经网络 / 链路预测 / 图对比学习 / 药物-靶点关联预测），中英混合
