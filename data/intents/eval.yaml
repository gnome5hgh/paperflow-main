# data/intents/eval.yaml —— held-out 评估集（验收契约，与 routes 严格逐字不相交）
# 规模：14 意图 ≈ 248 条（9 个新意图各 ≥10 条 held-out；整体硬负样本 ≥30%）
# 构成：近义改写 + 边界案例（复合意图取主意图 / 追问无 prev 上下文归 general / chitchat）
# 硬负样本：hard: true 标记——与其他意图近形的混淆样本（如「讲讲这篇论文讲的什么」标
#   analyze_paper 但形似 ask_question），让 per-intent 门槛对新意图有约束（Q2，防"自己给自己打分"）
# 领域：生物信息学/计算生物学（circRNA / miRNA / 异构图神经网络 / 链路预测 / 图对比学习 / 药物-靶点关联预测），中英混合
# ⚠️ 本集与 data/intents/routes.yaml 逐字不相交（含 general）——不相交测试 test_eval_disjoint_from_routes 兜底（泛化非记忆）
