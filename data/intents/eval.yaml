# data/intents/eval.yaml —— held-out 评估集（验收契约，与 routes 不相交）
# 规模：30 条/意图 × 5 意图 = 150 条（spec §4.7.1 的 ~25-30/意图）
# 构成：近义改写 + 边界案例（复合意图取主意图 / 追问无 prev 上下文归 general / chitchat）
# 领域：生物信息学/计算生物学（circRNA / miRNA / 异构图神经网络 / 链路预测 / 图对比学习 / 药物-靶点关联预测），中英混合
# ⚠️ 本集与 data/intents/routes.yaml 逐字不相交——不相交测试 test_eval_disjoint_from_routes 兜底（泛化非记忆）
eval:
  # search_paper —— 近义改写、下载意图、年代/主题限定、复合意图取主意图
