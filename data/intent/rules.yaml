# data/intent/rules.yaml —— 规则层的**高精度**模式（随仓库发布的生产资产）
#
# 规则层在判定模型之前跑，命中即定类、不命中即放行。它**永不猜测**：只收那些
# 「说了这句话基本不可能是别的意思」的模式。因此这张表天然是窄的——
# 判定模型能处理的开放说法（找论文、问答、选题）这里一条都不放，放进去只会
# 制造误命中，而误命中的代价高于多跑一次模型。
#
# 加一条规则前的自检：有没有一句正常的话会被它误吸？举不出反例再加。
# 每条模式都是正则（已做整句锚定或词形约束的地方见 note），必须能被 re.compile 通过。

rules:
  # ── 引用库：必须出现动作 + 库名，或直接点名 bib 文件名 ──
  # 顺序在 index 之前：句子里同时出现「入库」与「bib」时，用户的靶子是 bib
  # （「把最近入库的论文加到bib」）——只看「入库」会判错对象。
  - intent: citation
    pattern: '(references\.bib|bib ?文件|(加|导入|同步|对齐|更新|导出|渲染|整理|删|清理|补进|补齐|补录).{0,10}(引用库|文献库|bib)|(引用库|文献库|bib).{0,10}(加|导入|同步|对齐|更新|导出|渲染|整理|删|清理|补进|补齐|补录|条目|重复))'
    note: >-
      要求「动作 + 库名」成对出现，或直接点名 references.bib——只是**提到**引用库/文献库
      不算（「根据我的文献库推荐几个研究点」是在用文献库做选题，不是维护它）。
      动作词要够长：「补」这种单字会命中「补充」里的「补」（「给文献库里这篇论文补充一份
      精读笔记」不是维护引用库），故只收「补进/补齐/补录」。

  # ── 索引库：说法非常固定，且不会与「找论文」混 ──
  - intent: index
    pattern: '(入库|加入索引|加入知识库|建索引|重建.{0,4}索引|重新建.{0,4}索引|刷(一下)?索引|索引.{0,6}(不对|对不上|少了|乱)|知识库.{0,4}(更新|刷新)|让检索能搜到)'
    note: 指向「索引/知识库」这个对象的维护动作

  # ── 系统能力：固定问法 ──
  - intent: help
    pattern: '^(你(能|会|可以)(干什么|做什么|帮我做什么|提供哪些(帮助|服务|功能)|提供什么(帮助|服务))|有什么功能|有哪些功能|介绍一下你的功能|介绍一下你的能力|怎么用|如何使用|我不太会用|教我.{0,4}(怎么)?用|你会哪些操作)[^。]{0,4}[?？。]?$'
    note: 整句锚定——避免含「怎么用」的普通问题被吸进来（如「这个方法怎么用在小样本上」）

  # ── 自我信息查询：「我…哪些」的固定形态 ──
  - intent: memory
    pattern: '^(我(读过|看过|保存过|收藏过|标记过|关注过|做过|搜过|记过|浏览过|下载过)哪些.{0,8}|(查看|显示|打开|列出|看下|看一?下).{0,4}(我的)?(阅读记录|阅读历史|浏览历史|笔记列表|文献列表|收藏列表)|我(的)?(阅读记录|阅读历史|浏览历史|未读清单))[^。]{0,6}[?？。]?$'
    note: 整句锚定在「我…哪些」与「查我的清单」两种形态上；这只是记忆类的一半——「用户陈述自身信息」不靠规则（说法太开放），交给判定模型

  # ── 产出笔记：明确要一份笔记文件 ──
  - intent: note
    pattern: '(整理成笔记|整理成一份笔记|生成(?!的).{0,6}笔记|(写|做|生成)一?份.{0,6}笔记|记成笔记|总结.{0,8}(并)?(保存|存)(成|为).{0,4}笔记)'
    note: >-
      必须是「要产出笔记」的说法；只说「整理一下资料」不在此列。`生成(?!的)` 是挡
      「生成**的**笔记」——那是「已有一份笔记」的名词短语，不是要你去写一份。

  # ── 反馈：评价句式（含主体 + 被评价物 + 否定词）──
  - intent: feedback
    pattern: '((刚才|上次|之前|你).{0,10}(回答|回复|结果|建议|信息|笔记|论文|搜索|讲解).{0,10}(不对|不准确|有误|错了|有问题|不好|太差|漏(掉|了))|((你|系统).{0,6}(说错|讲错|答错|弄错))|(这个|那个|这次的)(回答|结果|回复|建议).{0,6}(不对|不太对|有误|错了|不太好))'
    note: >-
      三支：①「谁做的 + 被评价物 + 否定词」；②「你说错了」这类只带主体的；
      ③「这个回答不对」这类带指示代词的。三支都要求出现否定评价——单说
      「这个不对」不在此列（指代不明，交判定模型）

  # ── 纯寒暄：整句锚定，只收不含任何请求的短句 ──
  - intent: chitchat
    pattern: '^(你好|您好|嗨|hi|hello|哈喽|早上好|上午好|中午好|下午好|晚上好|晚安|在吗|谢谢|谢谢你|多谢|多谢啦|感谢|辛苦了|拜拜|拜拜啦|再见|bye|哈哈|嗯嗯|好的|收到|你是谁呀)[啊呀哦啦呢吧。，,！!~～\s]*$'
    note: 整句锚定——含这些词但另有请求的（如「你好，帮我下载两篇论文」）不在此列
