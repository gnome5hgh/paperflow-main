[project]
name = "paperflow"
version = "0.1.0"
description = "Academic research workflow assistant — Supervisor + SubAgent + Skills"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "dulwich>=0.22.0",
    "jieba>=0.42",
    "mcp>=1.0,<2.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "pymupdf>=1.24",
    # 书目提取：pdf2bib 自己是 MIT，但它依赖的 pdf2doi 会**硬导入** GPL-3.0 的
    # pdftitle（该库只在 Google 搜索兜底里用，本项目关掉了 websearch，因此从不被
    # 调用）。仓库不含 GPL 代码、只声明依赖，GPL 义务在分发组合作品时才产生；
    # 若要彻底避开，替代方案与实测代价见 ADR 0008 的「标题与书目」一节。
    "pdf2bib>=1.2",
    "rank_bm25>=0.2.2",
    "pymilvus[milvus-lite]>=2.4.2",
    # 图表原图的对象存储客户端（复用依赖栈里的 MinIO；见 rag/storage/image_store.py）
    "minio>=7.2",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
paperflow = "paperflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["paperflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
