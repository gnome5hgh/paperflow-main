[project]
name = "paperflow"
version = "0.1.0"
description = "Academic research workflow assistant — Supervisor + SubAgent + Skills"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "dulwich>=0.22.0",
    "jieba>=0.42",
    "mcp>=1.0,<2.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "rank_bm25>=0.2.2",
    "pymilvus[milvus-lite]>=2.4.2",
    "sentence-transformers>=5.4",
    "transformers>=4.51.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
]

[project.scripts]
paperflow = "paperflow.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["paperflow*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
