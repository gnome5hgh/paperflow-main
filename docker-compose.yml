# paperFlow 依赖服务栈：Milvus Standalone（etcd 元数据 + minio 对象存储 + milvus 计算）+ GROBID（PDF 解析）。
# 启动: docker compose up -d   验证: curl http://localhost:9091/healthz → OK（Milvus）、curl http://localhost:8070/api/isalive → true（GROBID）
# 数据卷统一收进 ./data/（workspace，gitignore 已盖）：Milvus 走 ./data/milvus/，GROBID 走 ./data/grobid/。
# ⚠️ GROBID 的 grobid-home 是 bind mount：首次需一次性把镜像内置的 grobid-home 复制到 ./data/grobid/
#    （否则空目录会遮蔽模型导致 GROBID 起不来），命令见 docs/测试指南/ 迁移 runbook。
# 注：GROBID 镜像是 linux/amd64，在 Apple Silicon 上经 OrbStack 仿真运行（与 docker run 一致）。
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./data/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      # 必须挂 /data（minio 镜像声明的 VOLUME 路径）而非其他路径：挂别的路径会触发
      # Docker 为未覆盖的 /data 自动创建匿名卷（落在 OrbStack volumes 目录的 hash 目录）。
      - ./data/milvus/minio:/data
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.18
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./data/milvus/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - minio

  grobid:
    container_name: grobid
    image: lfoppiano/grobid:0.8.0
    ports:
      - "8070:8070"
    volumes:
      # 持久化 grobid-home（模型+配置），须先一次性从镜像复制内容到 ./data/grobid/grobid-home
      - ./data/grobid/grobid-home:/opt/grobid/grobid-home

networks:
  default:
    name: milvus
