# paperFlow 依赖服务栈：Milvus Standalone（etcd 元数据 + minio 对象存储 + milvus 计算）。
# 启动: docker compose up -d   验证: curl http://localhost:9091/healthz → OK
# 数据卷统一收进 ./.paperflow/（运行时数据根，gitignore 已盖）：Milvus 走 ./.paperflow/infra/milvus/。
services:
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - ./.paperflow/infra/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
      # 启动初期 TSO 尚未就绪会连续失败：给足宽限期，避免启动即被判 unhealthy
      start_period: 15s

  minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      # 必须挂 /data（minio 镜像声明的 VOLUME 路径）而非其他路径：挂别的路径会触发
      # Docker 为未覆盖的 /data 自动创建匿名卷（落在 OrbStack volumes 目录的 hash 目录）。
      - ./.paperflow/infra/milvus/minio:/data
    command: minio server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      # minio/minio 镜像不带 curl（用 curl 探活会永远 unhealthy），用镜像自带的 mc
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 10s

  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.18
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ./.paperflow/infra/milvus/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    restart: unless-stopped
    depends_on:
      # 顺序 + 健康双条件：standalone 必须等 etcd/minio 真正 healthy 才启动
      # （此前列表形式不等健康，etcd TSO 超时导致 standalone 启动即 Exited(1)）
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

networks:
  default:
    name: milvus
